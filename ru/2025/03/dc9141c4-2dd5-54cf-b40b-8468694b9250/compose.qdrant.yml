services:
  qdrant:
    image: docker.io/qdrant/qdrant:v1.18
    container_name: vector
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage:Z
      - qdrant_conf:/qdrant/config:Z
    ports: ['6333:6333', '6334:6334']
    expose: ['6333', '6334', '6335']
    networks: ['example_net']
volumes:
  qdrant_data:
    driver: local
  qdrant_conf:
    driver: local
networks:
  example_net:
    driver: bridge
