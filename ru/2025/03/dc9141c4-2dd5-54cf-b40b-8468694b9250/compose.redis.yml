services:
  redis:
    image: docker.io/redis:latest
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data:Z
    ports: ['6379:6379']
    networks: ['example_net']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  redis_data:
    driver: local
networks:
  example_net:
    driver: bridge
